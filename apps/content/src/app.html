<!doctype html>
<html lang="en" class="yk-root">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <meta name="robots" content="noindex" />
        <!-- Keeps the messages that arrive before the frame's code runs (the app's hello); src/lib/frame/bridge.ts reads
             them. A file, not an inline script: the content origin's policy allows scripts from itself only. -->
        <script src="%sveltekit.assets%/early.js"></script>
        %sveltekit.head%
    </head>
    <body>
        <div>%sveltekit.body%</div>
    </body>
</html>
