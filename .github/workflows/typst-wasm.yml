# Builds the Typst compiler the preview runs: typst.ts's web compiler from upstream's source, with the patches of
# packages/typst-wasm (what each glyph of the document was typeset from, for the sync to the character). See that
# folder's README.md.
#
# On a pull request that touches the recipe: two builds on fresh runners, which must give the same archive, byte for
# byte. Nothing is published. By hand on main with `release`: the same, and then the archive becomes the asset of the
# release `typst-wasm-<upstream version>-yb.<build>`, which the app depends on by URL and hash. A release is never
# replaced: a new build is a new `build` number in upstream.json.
#
# No secrets. Only the release job can write, and only releases.
name: Typst compiler

on:
  pull_request:
    paths:
      - packages/typst-wasm/**
      - .github/workflows/typst-wasm.yml
  workflow_dispatch:
    inputs:
      release:
        description: Publish the archive as a release (main only)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.copy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        copy: [first, second]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: ./.github/actions/setup

      # What the check of the built package runs with (typst.ts's wrapper, a font).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 100000 --filter @yukibana/papers-typst-wasm

      # No cache: a build is rare, and a clean one keeps a cache out of what the release is trusted for.
      - name: Build
        run: pnpm --filter @yukibana/papers-typst-wasm exec ./build.sh "$RUNNER_TEMP/typst-wasm" "$RUNNER_TEMP/typst-wasm-out"

      - name: Keep the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typst-wasm-${{ matrix.copy }}
          path: ${{ runner.temp }}/typst-wasm-out
          if-no-files-found: error
          retention-days: 7

  same:
    name: Both builds are the same
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch both archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: typst-wasm-*
          path: builds

      - name: Compare
        run: |
          sha256sum builds/typst-wasm-first/*.tgz builds/typst-wasm-second/*.tgz
          diff builds/typst-wasm-first/BUILDINFO.json builds/typst-wasm-second/BUILDINFO.json
          cmp builds/typst-wasm-first/*.tgz builds/typst-wasm-second/*.tgz

  release:
    name: Release
    needs: same
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.repository == 'Yukibana-Ed/papers' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typst-wasm-first
          path: build

      # Fails if the release exists: a published build is not replaced.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive="$(basename build/*.tgz)"
          tag="typst-wasm-${archive#typst-ts-web-compiler-}"
          tag="${tag%.tgz}"
          gh release create "$tag" build/*.tgz build/BUILDINFO.json \
            --target "$GITHUB_SHA" --latest=false \
            --title "Typst compiler ${tag#typst-wasm-}" \
            --notes "typst.ts's web compiler built from upstream's source with the patches of packages/typst-wasm at this commit. BUILDINFO.json names upstream's commit, the tools and each file's SHA-256."
