# Uploads a pull request's Workers, which CI's check job built and bundled without any secret, as preview versions, and
# comments their URLs on the pull request. It runs main's copy of this file (workflow_run), never the pull request's,
# and only after a maintainer approves the `preview` environment: a Cloudflare token cannot be limited to uploads.
#
# Each preview pair is self-contained: the app's preview embeds the content origin's preview of the same pull request.
name: Preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# A newer push to the same branch replaces a preview still waiting for approval.
concurrency:
  group: preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  find:
    name: Find the build
    if: >-
      github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      found: ${{ steps.find.outputs.found }}
    steps:
      - name: Find the build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" --jq '[.artifacts[] | select(.name == "preview" and (.expired | not))] | length')
          echo "found=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  upload:
    name: Upload the previews
    needs: find
    if: needs.find.outputs.found == 'true' && github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.upload.outputs.web }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Main: wrangler.jsonc and wrangler come from here; the bundles, and every dependency in them, from the pull request.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: ./.github/actions/setup

      - name: Install wrangler
        run: pnpm --filter @yukibana/papers-web install --frozen-lockfile --fetch-timeout 100000

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview
          path: ${{ runner.temp }}/preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The artifact is the pull request's: it lands outside the checkout, and only the two output folders each app
      # needs come in, as plain files. Nothing else it holds (a .wrangler redirect, node_modules, a wrangler.jsonc) can
      # reach main's checkout, where wrangler runs.
      - name: Take the bundles
        env:
          FROM: ${{ runner.temp }}/preview
        run: |
          if [ -n "$(find "$FROM" -type l -print -quit)" ]; then echo "::error::the build holds a link"; exit 1; fi
          for app in web content; do
            for dir in cloudflare preview-worker; do
              test -d "$FROM/$app/.svelte-kit/$dir" || { echo "::error::the build has no $app/.svelte-kit/$dir"; exit 1; }
              mkdir -p "apps/$app/.svelte-kit"
              rm -rf "apps/$app/.svelte-kit/$dir"
              cp -R "$FROM/$app/.svelte-kit/$dir" "apps/$app/.svelte-kit/$dir"
            done
          done
          rm -rf "$FROM"

      # Versions that serve only at their preview URLs: the deployed Workers stay as they are. The pair names each other:
      # the app embeds the content preview, and the content preview lets only the app preview frame it. Both aliases
      # are known before either upload, from the account's workers.dev subdomain.
      - name: Upload the previews
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
          web="https://pr-$PR-yukibana-papers.$sub.workers.dev"
          content="https://pr-$PR-yukibana-papers-content.$sub.workers.dev"
          wrangler="$PWD/apps/web/node_modules/.bin/wrangler"
          upload() { # app, var
            out="$RUNNER_TEMP/wrangler-$1.ndjson"
            (cd "apps/$1" && WRANGLER_OUTPUT_FILE_PATH="$out" "$wrangler" versions upload .svelte-kit/preview-worker/_worker.js --no-bundle --preview-alias "pr-$PR" --tag "pr-$PR" --message "Preview of #$PR at $HEAD_SHA" --var "$2")
            url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$out" | tail -n 1)
            if [ "$url" != "$3" ]; then
              echo "::error::wrangler reported '$url' for $1, not $3: preview URLs must be enabled for the Worker (preview_urls in wrangler.jsonc)"
              exit 1
            fi
          }
          upload content "APP_ORIGIN:$web" "$content"
          upload web "CONTENT_ORIGIN:$content" "$web"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "content=$content" >> "$GITHUB_OUTPUT"

      - name: Comment the URLs
        env:
          GH_TOKEN: ${{ github.token }}
          WEB: ${{ steps.upload.outputs.web }}
          CONTENT: ${{ steps.upload.outputs.content }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "Preview of $HEAD_SHA: $WEB

          Its content origin: $CONTENT"
