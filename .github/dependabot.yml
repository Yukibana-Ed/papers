# Dependabot proposes the updates; CI decides whether they are safe. Nothing is proposed until it is 14 days old, the
# same age pnpm's minimumReleaseAge (pnpm-workspace.yaml) asks of anything installed: the versions that carry a
# supply-chain compromise are the ones published minutes ago.
version: 2
updates:
  # One entry for the whole workspace: the catalog in pnpm-workspace.yaml holds every version.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      vitest:
        patterns: ['vitest', '@vitest/*']
      svelte:
        patterns: ['svelte', 'svelte-check', '@sveltejs/*', 'vite']
      oxc:
        patterns: ['oxlint', 'oxlint-tsgolint', 'oxfmt']
      wrangler:
        patterns: ['wrangler', '@cloudflare/*']
    ignore:
      # The ts6 catalog stays on TypeScript 6 for svelte-check; the default catalog's major is bumped by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node describes the Node release that devEngines names, which moves by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # Actions run with the repository's secrets, so a compromised one reads them.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
